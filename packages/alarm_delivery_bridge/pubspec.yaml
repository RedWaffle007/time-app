name: alarm_delivery_bridge
description: Registers Checkmate's native alarm delivery channel in every Flutter engine.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.timeapp.alarm_delivery_bridge
        pluginClass: AlarmDeliveryBridgePlugin
