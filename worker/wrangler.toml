name = "time-app-notify"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
# */5: six-hour inactivity nudges. Every minute: approval reminders (a 5-minute
# plan needs minute resolution). index.js `cronJobFor` routes by this string.
crons = ["*/5 * * * *", "* * * * *"]

# Non-secret config. The project id is a public identifier.
[vars]
PROJECT_ID = "time-app-1e1c9"
SUPABASE_URL = "https://sssbuqrseunytlcqhlqy.supabase.co"
SUPABASE_BUCKET = "avatars"

# Profile/group-picture storage (Supabase). Non-secret: the project URL and the
# bucket name are both public identifiers — the public object URL contains
# them. Chosen over Firebase Storage because that needs the Blaze plan and this
# project has no payment card attached (DECISIONS.md); chosen over Cloudflare
# R2 because R2 requires a card even on its free tier.
#
# SET THESE before deploying the avatar routes. Until they are set, /avatar and
# /group-avatar answer 500 `storage-not-configured`; they do not half-work.
# SUPABASE_URL    = "https://<project>.supabase.co"
# SUPABASE_BUCKET = "avatars"     # create it PUBLIC in the Supabase dashboard

# The service-account JSON is NOT here. It is set as an encrypted secret:
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
# and read at runtime as env.FIREBASE_SERVICE_ACCOUNT. It never lands in git.

# The Supabase service_role key is NOT here. Like the Firebase service account
# above, it is an encrypted secret:
#   wrangler secret put SUPABASE_SERVICE_KEY
# It bypasses every storage policy, so it must never reach a client or git.
