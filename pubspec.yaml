name: time_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+4

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version is constrained by flutter_localizations; `any` lets it resolve.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.0.4
  google_sign_in: ^7.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  share_plus: ^13.2.1
  http: ^1.2.2
  firebase_crashlytics: ^5.2.6

  # App lock. `local_auth` prompts biometrics AND falls back to the device
  # credential (PIN/pattern/password); `shared_preferences` holds the on/off
  # flag. The flag is a DEVICE concern and deliberately does NOT live on the
  # Firestore profile — locking this phone must not lock a second one. No secret
  # is stored here: the real security is the OS keystore behind local_auth, and
  # this is a boolean.
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2

  # Voice STT (redesign S6). `speech_to_text` wraps the PLATFORM recognizer
  # (Android SpeechRecognizer / iOS SFSpeechRecognizer) — on-device where the OS
  # ships offline models, otherwise routed by the OS to its own free service.
  # No API key, no per-call billing, no network code of ours: the same
  # no-Blaze, privacy-leaning posture as the on-device chatbot. It is the ONLY
  # thing that requests RECORD_AUDIO. `flutter_tts` speaks the two prompts aloud
  # ("audio + on-screen text") through the platform TTS; it needs no permission.
  # Both stay behind the `SpeechService` seam (data/speech_service.dart) — no OS
  # vocabulary crosses it, so an iOS or on-device swap is one provider line.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # On-device chatbot model files (~143MB), downloaded from a GitHub Release on
  # first use rather than bundled in the APK. Both were already resolving as
  # transitive dependencies at these exact versions — promoting them to direct
  # only records that this code calls them by name; no new package resolves.
  #
  # `path_provider` finds the app-private support directory the files live in.
  # `crypto` streams a sha256 over a downloaded file so a half-finished or
  # corrupted download can never be installed as if it were good.
  path_provider: ^2.1.6
  crypto: ^3.0.7

  # The on-device chatbot engine. `flutter_onnxruntime` wraps Microsoft's
  # ONNX Runtime (1.23.0 on Android) and is what actually runs the MiniLM
  # graph; it takes a model FILE PATH, which is what makes a downloaded —
  # rather than bundled — model possible at all.
  #
  # `characters` is the Unicode grapheme-cluster iterator. It is not a
  # convenience here: SentencePiece's normalizer walks graphemes, not code
  # points, and reproducing its output exactly is what keeps a query in the
  # same embedding space as the corpus index.
  flutter_onnxruntime: ^1.8.3
  characters: ^1.4.1
  flutter_local_notifications: ^22.3.0

  # Reads Build.MANUFACTURER (and model/SDK) so first-run permission onboarding
  # can decide whether an OEM needs the autostart step and which per-OEM guided
  # copy to show. Flutter-community maintained; adds no permission of its own.
  # The actual autostart intent resolve+launch and the battery-exemption dialog
  # live natively in MainActivity — device_info_plus is only the branch selector.
  device_info_plus: ^13.2.0

  # Choosing a profile picture from the gallery or camera. Flutter-team
  # maintained, BSD-3, and it hands back a file path plus the picked file's
  # bytes — which is all `AvatarUploader` takes.
  #
  # Crop/compress is applied to STATIC images only (see `image_cropper` below and
  # DECISIONS.md 2026-08-23). Re-encoding an animated GIF or WebP flattens it to
  # one frame, so animated formats keep the never-re-encode path and are size-
  # capped instead — the original reason this pairing was avoided, now scoped to
  # the case where it actually bites.
  image_picker: ^1.1.2

  # The in-app calendar's month and week grids. Apache-2.0, actively released
  # (3.2.1, 2026-08-09), ~585k downloads/30d, and its only non-Flutter
  # dependencies are `intl` — already ours at 0.20.2 — and a small gesture
  # helper. No platform channel, so it adds no permission and no native code.
  #
  # It supplies the month/week GRID and its paging only. There is deliberately
  # no day view here: `table_calendar` has none, and a `ScheduleItem` carries an
  # instant rather than a span (it has no duration field), so a day view drawn
  # as sized blocks would be inventing a duration the model does not have. The
  # day view is therefore an hour RAIL, hand-written in
  # `features/calendar/presentation/calendar_day_view.dart`.
  table_calendar: ^3.2.1

  # Crop-with-zoom UI for the profile picture, used for STATIC images ONLY
  # (JPEG/PNG). It downscales + compresses as it crops, which is what fixes the
  # "too large" rejection on a modern camera photo. It re-encodes — so it is
  # NEVER run on an animated GIF/WebP, which would lose the animation; those take
  # the direct upload path and a 5MB cap instead. See DECISIONS.md 2026-08-23
  # ("Avatar crop/compress — static only"). Requires UCropActivity in the Android
  # manifest.
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Brand + UI typefaces, all OFL, bundled offline (a splash cannot wait on a
  # network font; the body font must render before first paint). See UI-RULES.md
  # §3 and lib/features/splash/.
  #   - Space Grotesk: headings, big numbers, and the CHECKMATE wordmark — the
  #     "characterful geometric" heading face (DESIGN-NOTES §3). Variable font;
  #     Flutter maps fontWeight onto its wght axis.
  #   - Manrope: body / UI text — a clean, highly legible neutral sans. Non-Latin
  #     glyphs fall back to the system font automatically.
  #   - Anton: retained only as a fallback display face; no longer the wordmark.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
